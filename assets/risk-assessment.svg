<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#171820"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7062ed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7062ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- ISM Hierarchy Pyramid (right side) -->
  <g opacity="0.9">
    <polygon points="440,80 480,80 500,120 420,120" fill="#7062ed" opacity="0.85"/>
    <polygon points="420,125 500,125 515,165 405,165" fill="#8b7ff0" opacity="0.75"/>
    <polygon points="405,170 515,170 525,210 395,210" fill="#a59bf3" opacity="0.65"/>
    <polygon points="395,215 525,215 530,255 390,255" fill="#c0b8f7" opacity="0.55"/>
    <polygon points="390,260 530,260 535,300 385,300" fill="#ddd9fb" opacity="0.45"/>
    <polygon points="385,305 535,305 540,345 380,345" fill="#f0edfd" opacity="0.35"/>
    <!-- Layer labels -->
    <text x="555" y="104" fill="#a59bf3" font-size="9" font-family="Arial">L1</text>
    <text x="560" y="149" fill="#a59bf3" font-size="9" font-family="Arial">L2</text>
    <text x="560" y="194" fill="#a59bf3" font-size="9" font-family="Arial">L3</text>
    <text x="560" y="239" fill="#a59bf3" font-size="9" font-family="Arial">L4</text>
    <text x="560" y="284" fill="#a59bf3" font-size="9" font-family="Arial">L5</text>
    <text x="560" y="329" fill="#a59bf3" font-size="9" font-family="Arial">L6</text>
  </g>

  <!-- DEMATEL Network (left side) -->
  <g>
    <!-- Connection lines -->
    <g stroke="#7062ed" stroke-width="1" opacity="0.35">
      <line x1="110" y1="100" x2="180" y2="160"/>
      <line x1="110" y1="100" x2="90" y2="220"/>
      <line x1="180" y1="160" x2="250" y2="110"/>
      <line x1="180" y1="160" x2="200" y2="260"/>
      <line x1="90" y1="220" x2="200" y2="260"/>
      <line x1="90" y1="220" x2="60" y2="310"/>
      <line x1="200" y1="260" x2="250" y2="110"/>
      <line x1="200" y1="260" x2="280" y2="300"/>
      <line x1="60" y1="310" x2="200" y2="260"/>
      <line x1="250" y1="110" x2="280" y2="200"/>
      <line x1="280" y1="200" x2="280" y2="300"/>
      <line x1="110" y1="100" x2="250" y2="110"/>
    </g>
    <!-- Nodes -->
    <g filter="url(#blur1)">
      <circle cx="110" cy="100" r="18" fill="url(#glowPurple)"/>
      <circle cx="180" cy="160" r="15" fill="url(#glowPurple)"/>
      <circle cx="90" cy="220" r="16" fill="url(#glowCyan)"/>
      <circle cx="250" cy="110" r="14" fill="url(#glowPurple)"/>
      <circle cx="200" cy="260" r="20" fill="url(#glowPurple)"/>
      <circle cx="60" cy="310" r="13" fill="url(#glowCyan)"/>
      <circle cx="280" cy="200" r="12" fill="url(#glowCyan)"/>
      <circle cx="280" cy="300" r="14" fill="url(#glowPurple)"/>
    </g>
    <circle cx="110" cy="100" r="7" fill="#7062ed"/>
    <circle cx="180" cy="160" r="6" fill="#8b7ff0"/>
    <circle cx="90" cy="220" r="6" fill="#4ecdc4"/>
    <circle cx="250" cy="110" r="5" fill="#7062ed"/>
    <circle cx="200" cy="260" r="8" fill="#7062ed"/>
    <circle cx="60" cy="310" r="5" fill="#4ecdc4"/>
    <circle cx="280" cy="200" r="5" fill="#4ecdc4"/>
    <circle cx="280" cy="300" r="6" fill="#8b7ff0"/>
  </g>

  <!-- Center: Cloud Model Score -->
  <g>
    <!-- Cloud shape -->
    <ellipse cx="330" cy="195" rx="55" ry="35" fill="#7062ed" opacity="0.15"/>
    <ellipse cx="310" cy="185" rx="28" ry="20" fill="#7062ed" opacity="0.2"/>
    <ellipse cx="355" cy="185" rx="30" ry="22" fill="#8b7ff0" opacity="0.2"/>
    <ellipse cx="335" cy="210" rx="35" ry="20" fill="#7062ed" opacity="0.15"/>
    <!-- Score text -->
    <text x="330" y="195" text-anchor="middle" fill="#e8e6f5" font-size="26" font-weight="bold" font-family="Arial">81.4</text>
    <text x="330" y="215" text-anchor="middle" fill="#4ecdc4" font-size="11" font-family="Arial">良好</text>
  </g>

  <!-- Title -->
  <text x="300" y="45" text-anchor="middle" fill="#e8e6f5" font-size="16" font-weight="bold" font-family="Arial">航空公司运行控制风险评估</text>
  <text x="300" y="65" text-anchor="middle" fill="#8b7ff0" font-size="10" font-family="Arial" opacity="0.8">DEMATEL-ISM · 熵值法 · 云模型</text>

  <!-- Bottom labels -->
  <text x="170" y="375" text-anchor="middle" fill="#72737e" font-size="10" font-family="Arial">DEMATEL 影响网络</text>
  <text x="470" y="375" text-anchor="middle" fill="#72737e" font-size="10" font-family="Arial">ISM 层级结构</text>
</svg>
